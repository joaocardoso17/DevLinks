<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>DevLinks</title>
  </head>
  <body>
    <div id="container">
      <div id="profile">
        <img src="./assets/avatar.png" alt="Foto de perfil" />
        <p>@joaocardoso</p>
      </div>
      <div id="switch" onclick="toggleMode()">
        <button></button>
        <span></span>
      </div>
      <ul>
          <li>
            <a href="https://github.com/joaocardoso17" target="_blank"
              >Meu GitHub</a
            >
          </li>
          <li><a href="#" id="portfolio-link">Meu portfólio</a></li>
          <li>
            <a href="https://linkedin.com/in/joaocardoso-dev" target="_blank"
              >Vamos nos conectar no LinkedIn</a
            >
          </li>
          <li><a href="mailto:joaocardev@gmail.com">Fale comigo</a></li>
      </ul>
      <div id="social-links">
        <a href="https://github.com/joaocardoso17" target="_blank" rel="noopener noreferrer"
          ><ion-icon name="logo-github"></ion-icon
        ></a>
        <a href="https://instagram.com/joaocardoso.dev" target="_blank" rel="noopener noreferrer"
          ><ion-icon name="logo-instagram"></ion-icon
        ></a>
        <a href="https://linkedin.com/in/joaocardoso-dev" target="_blank" rel="noopener noreferrer"
          ><ion-icon name="logo-linkedin"></ion-icon
        ></a>
      </div>
    </div>
    <footer>
      <p>Feito com 💜 por João Cardoso</p>
    </footer>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>

    <script src="./script.js"></script>
  </body>
</html>
